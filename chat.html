<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محادثة</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="chat-body">

  <div class="app-container">
    <header class="chat-header">
      <div class="user-info">
        <div class="avatar">
          <i class="fa-solid fa-user"></i>
        </div>
        <div class="status-container">
          <span class="contact-name">المحادثة</span>
          <span id="status-indicator" class="status-offline">غير متصل</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="logout-btn" type="button" title="تسجيل خروج">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <main id="chat-messages" class="chat-messages">
    </main>

    <div id="typing-indicator" class="typing-indicator hidden">
      <span>جاري الكتابة...</span>
    </div>

    <footer class="chat-footer">
      <form id="chat-form" autocomplete="off">
        <div class="input-wrapper">
          <input type="text" id="message-input" placeholder="اكتب رسالة..." required>
        </div>
        <button type="submit" id="send-btn" title="إرسال">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </footer>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
