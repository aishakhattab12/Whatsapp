<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محادثة</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="chat-body" data-theme="dark">

  <div class="app-container">
    <!-- الشريط العلوي لشات واتساب -->
    <header class="chat-header">
      <div class="user-info">
        <div class="avatar">
          <i class="fa-solid fa-user"></i>
        </div>
        <div class="status-container">
          <span class="contact-name">المحادثة</span>
          <span id="status-indicator" class="status-offline">غير متصل</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="search-toggle-btn" type="button" title="بحث">
          <i class="fa-solid fa-search"></i>
        </button>
        <button id="theme-toggle-btn" type="button" title="تغيير الثيم">
          <i class="fa-solid fa-moon"></i>
        </button>
        <button id="logout-btn" type="button" title="تسجيل خروج">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <!-- صندوق البحث المخفي -->
    <div id="search-container" class="search-container hidden">
      <input type="text" id="search-input" placeholder="ابحث في الرسائل...">
      <button id="close-search-btn" type="button"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- لوحة الرسالة المثبتة -->
    <div id="pinned-banner" class="pinned-banner hidden">
      <div class="pinned-content">
        <i class="fa-solid fa-thumbtack"></i>
        <span id="pinned-text">رسالة مثبتة</span>
      </div>
      <button id="close-pinned-btn" type="button"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- منطقة عرض الرسائل -->
    <main id="chat-messages" class="chat-messages">
      <!-- يتم حقن الرسائل هنا برمجياً -->
    </main>

    <!-- مؤشر جاري الكتابة المطابق لواتساب -->
    <div id="typing-indicator" class="typing-indicator hidden">
      <span>يكتب الآن...</span>
    </div>

    <!-- صندوق الرد (Reply Preview) -->
    <div id="reply-preview" class="reply-preview hidden">
      <div class="reply-preview-content">
        <span id="reply-preview-text"></span>
      </div>
      <button id="cancel-reply-btn" type="button"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- لوحة الإيموجي المنبثقة -->
    <div id="emoji-picker" class="emoji-picker hidden">
      <span class="emoji-item">😊</span>
      <span class="emoji-item">😂</span>
      <span class="emoji-item">❤️</span>
      <span class="emoji-item">👍</span>
      <span class="emoji-item">🔥</span>
      <span class="emoji-item">🎉</span>
      <span class="emoji-item">😢</span>
      <span class="emoji-item">😮</span>
      <span class="emoji-item">🙏</span>
      <span class="emoji-item">✨</span>
      <span class="emoji-item">💡</span>
      <span class="emoji-item">🚀</span>
    </div>

    <!-- صندوق إدخال الرسائل -->
    <footer class="chat-footer">
      <form id="chat-form" autocomplete="off">
        <button type="button" id="emoji-btn" title="إيموجي"><i class="fa-regular fa-face-smile"></i></button>
        <label for="file-input" class="attach-btn" title="إرفاق ملف/صورة"><i class="fa-solid fa-paperclip"></i></label>
        <input type="file" id="file-input" accept="image/*,.pdf,.doc,.docx,.txt" class="hidden">
        
        <div class="input-wrapper">
          <input type="text" id="message-input" placeholder="اكتب رسالة...">
        </div>

        <button type="button" id="mic-btn" title="تسجيل صوتي"><i class="fa-solid fa-microphone"></i></button>
        <button type="submit" id="send-btn" title="إرسال"><i class="fa-solid fa-paper-plane"></i></button>
      </form>
    </footer>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
