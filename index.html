<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-icon">
      <i class="fa-solid fa-comments"></i>
    </div>
    <h2>تسجيل الدخول</h2>
    <p class="login-subtitle">الرجاء إدخال بيانات الحساب للمتابعة</p>

    <form id="login-form">
      <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input type="text" id="username" placeholder="اسم المستخدم" required autocomplete="off">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="password" placeholder="كلمة المرور" required>
      </div>

      <div id="error-msg" class="error-msg hidden">اسم المستخدم أو كلمة المرور غير صحيحة.</div>

      <button type="submit" class="login-btn">دخول</button>
    </form>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
